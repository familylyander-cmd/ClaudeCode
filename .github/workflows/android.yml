name: Bygg Android-app

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android-app/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Bostadsbevakning.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bostadsbevakning-apk
          path: android-app/Bostadsbevakning.apk
      - name: Publicera som release (ladda ned direkt från mobilen)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Bostadsbevakning – senaste Android-version
          body: "Installera Bostadsbevakning.apk på din Android-mobil. Byggd från ${{ github.sha }}."
          files: android-app/Bostadsbevakning.apk
          make_latest: true
